<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151618">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">

  <title>404: página no encontrada — CurseStone</title>
  <meta name="description" content="La página que buscas no existe en CurseStone. Vuelve al inicio o consulta las releases y la documentación.">

  <link rel="icon" href="https://raw.githubusercontent.com/CurseStoneORG/CurseStone/stable/logo.svg" type="image/svg+xml">

  <script src="/js/theme-init.js"></script>

  <link rel="preload" href="/fonts/Minecraft.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/Minecraft-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .error-shell { max-width: 880px; margin: 0 auto; padding: 28px 20px 48px; }
    .error-code { margin: 10vh 0 8px; font-size: 4.5rem; line-height: 1; color: var(--accent-2); }
    .error-shell h1 { margin-bottom: 12px; }
    .error-shell .button-row { margin-top: 28px; }
  </style>
</head>
<body>
  <div class="error-shell">
    <p class="error-code">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección que has abierto no existe o ha cambiado. Puedes volver al inicio, mirar las releases o leer la documentación.</p>
    <div class="button-row">
      <a class="btn btn-primary btn-lg" href="/">Inicio</a>
      <a class="btn btn-lg" href="/releases/">Releases</a>
      <a class="btn btn-lg" href="/docs/">Documentación</a>
    </div>
  </div>
</body>
</html>
